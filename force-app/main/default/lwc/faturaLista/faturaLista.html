<template>
    <div class="list-card">
        <div class="list-card__toolbar">
            <div class="list-card__toolbar-left">
                <div class="list-card__view-select-wrap">
                    <button class="list-card__view-select" onclick={togglePicker} aria-haspopup="true" aria-expanded={isPickerOpen}>
                        <span class="slds-truncate">{selectedViewLabel}</span>
                        <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                    </button>

                    <template if:true={isPickerOpen}>
                        <div class="list-card__dropdown-overlay" onclick={handleOverlayClick}></div>
                        <div class="slds-dropdown slds-dropdown_left list-card__dropdown" role="menu">
                            <p class="slds-dropdown__header slds-text-title_caps">Modos de exibição de lista</p>
                            <ul class="slds-dropdown__list" role="presentation">
                                <template for:each={views} for:item="v">
                                    <li key={v.value} role="presentation" class="slds-dropdown__item">
                                        <a href="javascript:void(0);" role="menuitem" data-value={v.value} onclick={handleViewSelect}>
                                            <span class="slds-truncate">{v.label}</span>
                                        </a>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </div>
            </div>

            <div class="list-card__toolbar-right">
                <span class="list-card__total slds-text-body_small">Total {totalCount}</span>
                <div class="list-card__search">
                    <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                    <input
                        type="text"
                        class="list-card__search-input"
                        placeholder="Pesquisar nesta lista..."
                        value={searchTerm}
                        oninput={handleSearchInput}
                    />
                </div>
                <button class="list-card__refresh" title="Atualizar" onclick={handleRefresh}>
                    <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                </button>
                <button class="list-card__filter" title="Filtrar">
                    <lightning-icon icon-name="utility:filterList" size="x-small"></lightning-icon>
                </button>
            </div>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Carregando faturas" size="small"></lightning-spinner>
        </template>

        <template if:true={errorMessage}>
            <div class="slds-text-color_error slds-var-p-around_small" role="alert">
                {errorMessage}
            </div>
        </template>

        <template if:true={showWaitingForAccount}>
            <div class="slds-text-color_weak slds-var-p-around_small">
                Selecione uma empresa para ver as faturas.
            </div>
        </template>

        <template if:true={showEmptyState}>
            <div class="slds-text-color_weak slds-var-p-around_small">
                Nenhuma fatura encontrada para esta empresa.
            </div>
        </template>

        <template if:true={hasFaturas}>
            <div class="list-card__table-wrap">
                <table class="list-card__table">
                    <colgroup>
                        <col class="list-card__col-rownum" />
                        <col style={numeroColStyle} />
                        <template if:true={showStatusEarly}>
                            <col style={statusColStyle} />
                        </template>
                        <template if:true={showValorVencimentoNormal}>
                            <col style={valorColStyle} />
                            <col style={vencimentoColStyle} />
                        </template>
                        <template if:true={showVencimentoValorInvertido}>
                            <col style={vencimentoColStyle} />
                            <col style={valorColStyle} />
                        </template>
                        <template if:true={showStatusLate}>
                            <col style={statusColStyle} />
                        </template>
                        <template if:true={showContrato}>
                            <col style={contratoColStyle} />
                        </template>
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="list-card__th-rownum"></th>
                            <th class={numeroThClass} data-field="numero" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Número</span>
                                    <lightning-icon if:true={isSortedByNumero} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByNumero} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="numero" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="numero" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenNumero}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="numero" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="numero" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            <template if:true={showStatusEarly}>
                            <th class={statusThClass} data-field="status" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Status</span>
                                    <lightning-icon if:true={isSortedByStatus} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByStatus} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="status" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="status" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenStatus}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="status" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="status" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            </template>
                            <template if:true={showValorVencimentoNormal}>
                            <th class={valorThClass} data-field="valor" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Valor Total</span>
                                    <lightning-icon if:true={isSortedByValor} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByValor} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="valor" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="valor" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenValor}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="valor" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="valor" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            <th class={vencimentoThClass} data-field="vencimento" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Vencimento</span>
                                    <lightning-icon if:true={isSortedByVencimento} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByVencimento} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="vencimento" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="vencimento" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenVencimento}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="vencimento" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="vencimento" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            </template>
                            <template if:true={showVencimentoValorInvertido}>
                            <th class={vencimentoThClass} data-field="vencimento" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Vencimento</span>
                                    <lightning-icon if:true={isSortedByVencimento} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByVencimento} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="vencimento" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="vencimento" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenVencimento}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="vencimento" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="vencimento" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            <th class={valorThClass} data-field="valor" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Valor Total</span>
                                    <lightning-icon if:true={isSortedByValor} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByValor} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="valor" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="valor" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenValor}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="valor" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="valor" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            </template>
                            <template if:true={showStatusLate}>
                            <th class={statusThClass} data-field="status" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Status</span>
                                    <lightning-icon if:true={isSortedByStatus} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByStatus} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="status" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="status" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenStatus}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="status" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="status" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            </template>
                            <template if:true={showContrato}>
                            <th class={contratoThClass} data-field="contrato" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Contrato</span>
                                    <lightning-icon if:true={isSortedByContrato} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByContrato} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="contrato" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="contrato" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenContrato}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="contrato" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="contrato" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={displayedFaturas} for:item="f">
                            <tr key={f.id}>
                                <td class="list-card__td-rownum">{f.rowNumber}</td>
                                <td class={numeroCellClass}>
                                    <a href={f.recordUrl} data-record-id={f.id} onclick={handleRecordClick}>{f.numero}</a>
                                </td>
                                <template if:true={showStatusEarly}>
                                <td class={statusCellClass}>{f.status}</td>
                                </template>
                                <template if:true={showValorVencimentoNormal}>
                                <td class={valorCellClass}>{f.valorFormatado}</td>
                                <td class={vencimentoCellClass}>{f.vencimentoFormatado}</td>
                                </template>
                                <template if:true={showVencimentoValorInvertido}>
                                <td class={vencimentoCellClass}>{f.vencimentoFormatado}</td>
                                <td class={valorCellClass}>{f.valorFormatado}</td>
                                </template>
                                <template if:true={showStatusLate}>
                                <td class={statusCellClass}>{f.status}</td>
                                </template>
                                <template if:true={showContrato}>
                                <td class={contratoCellClass}>{f.contrato}</td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </div>
</template>
