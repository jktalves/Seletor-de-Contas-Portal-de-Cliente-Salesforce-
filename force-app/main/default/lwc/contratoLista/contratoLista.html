<template>
    <div class="list-card">
        <div class="list-card__toolbar">
            <div class="list-card__toolbar-left">
                <div class="list-card__view-select-wrap">
                    <button class="list-card__view-select" onclick={togglePicker} aria-haspopup="true" aria-expanded={isPickerOpen}>
                        <span class="slds-truncate">{selectedViewLabel}</span>
                        <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                    </button>

                    <template if:true={isPickerOpen}>
                        <div class="list-card__dropdown-overlay" onclick={handleOverlayClick}></div>
                        <div class="slds-dropdown slds-dropdown_left list-card__dropdown" role="menu">
                            <p class="slds-dropdown__header slds-text-title_caps">Modos de exibição de lista</p>
                            <ul class="slds-dropdown__list" role="presentation">
                                <template for:each={views} for:item="v">
                                    <li key={v.value} role="presentation" class="slds-dropdown__item">
                                        <a href="javascript:void(0);" role="menuitem" data-value={v.value} onclick={handleViewSelect}>
                                            <span class="slds-truncate">{v.label}</span>
                                        </a>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <template if:true={showListMeta}>
            <p class="list-card__view-meta slds-text-body_small">{listMetaText}</p>
        </template>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Carregando contratos" size="small"></lightning-spinner>
        </template>

        <template if:true={errorMessage}>
            <div class="slds-text-color_error slds-var-p-around_small" role="alert">
                {errorMessage}
            </div>
        </template>

        <template if:true={showWaitingForAccount}>
            <div class="slds-text-color_weak slds-var-p-around_small">
                Selecione uma empresa para ver os contratos.
            </div>
        </template>

        <template if:true={showEmptyState}>
            <div class="slds-text-color_weak slds-var-p-around_small">
                Nenhum contrato encontrado para esta empresa.
            </div>
        </template>

        <template if:true={hasContratos}>
            <div class="list-card__table-wrap">
                <table class="list-card__table">
                    <colgroup>
                        <col class="list-card__col-rownum" />
                        <col style={numeroColStyle} />
                        <template if:true={showDataEntrega}>
                            <col style={dataEntregaColStyle} />
                        </template>
                        <template if:true={showTerminoContrato}>
                            <col style={terminoContratoColStyle} />
                        </template>
                        <col style={contatoColStyle} />
                        <col style={enderecoColStyle} />
                        <template if:true={showStatus}>
                            <col style={statusColStyle} />
                        </template>
                        <template if:true={showValor}>
                            <col style={valorColStyle} />
                        </template>
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="list-card__th-rownum"></th>
                            <th class={numeroThClass} data-field="numero" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Número</span>
                                    <lightning-icon if:true={isSortedByNumero} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByNumero} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="numero" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="numero" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenNumero}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="numero" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="numero" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            <template if:true={showDataEntrega}>
                            <th class={dataEntregaThClass} data-field="dataEntrega" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Data Agendada para o Atendimento</span>
                                    <lightning-icon if:true={isSortedByDataEntrega} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByDataEntrega} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="dataEntrega" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="dataEntrega" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenDataEntrega}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="dataEntrega" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="dataEntrega" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            </template>
                            <template if:true={showTerminoContrato}>
                            <th class={terminoContratoThClass} data-field="terminoContrato" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Término do contrato</span>
                                    <lightning-icon if:true={isSortedByTerminoContrato} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByTerminoContrato} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="terminoContrato" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="terminoContrato" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenTerminoContrato}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="terminoContrato" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="terminoContrato" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            </template>
                            <th class={contatoThClass} data-field="contato" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Contato</span>
                                    <lightning-icon if:true={isSortedByContato} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByContato} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="contato" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="contato" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenContato}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="contato" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="contato" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            <th class={enderecoThClass} data-field="endereco" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Endereço</span>
                                    <lightning-icon if:true={isSortedByEndereco} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByEndereco} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="endereco" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="endereco" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenEndereco}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="endereco" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="endereco" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            <template if:true={showStatus}>
                            <th class={statusThClass} data-field="status" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Status</span>
                                    <lightning-icon if:true={isSortedByStatus} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByStatus} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="status" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="status" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenStatus}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="status" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="status" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            </template>
                            <template if:true={showValor}>
                            <th class={valorThClass} data-field="valor" onclick={handleSort}>
                                <span class="list-card__th-inner">
                                    <span class="list-card__th-label">Valor</span>
                                    <lightning-icon if:true={isSortedByValor} icon-name={sortIconName} size="xx-small"></lightning-icon>
                                    <lightning-icon if:false={isSortedByValor} icon-name="utility:down" size="xx-small" class="list-card__th-chevron" data-field="valor" onclick={handleColumnMenuToggle}></lightning-icon>
                                </span>
                                <span class="list-card__resize-handle" data-field="valor" onmousedown={handleResizeStart} onclick={handleResizeHandleClick}></span>
                            <template if:true={isColumnMenuOpenValor}>
                                <div class="list-card__dropdown-overlay" onclick={handleColumnOverlayClick}></div>
                                <div class="slds-dropdown slds-dropdown_left list-card__column-menu" role="menu">
                                    <ul class="slds-dropdown__list" role="presentation">
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="valor" data-mode="wrap" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Quebrar texto</span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a href="javascript:void(0);" role="menuitem" data-field="valor" data-mode="clip" onclick={handleColumnModeSelect}>
                                                <span class="slds-truncate">Cortar texto</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </template>
                            </th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={displayedContratos} for:item="c">
                            <tr key={c.id}>
                                <td class="list-card__td-rownum">{c.rowNumber}</td>
                                <td class={numeroCellClass}>
                                    <a href={c.recordUrl} data-record-id={c.id} onclick={handleRecordClick}>{c.numero}</a>
                                </td>
                                <template if:true={showDataEntrega}>
                                <td class={dataEntregaCellClass}>{c.dataEntregaFormatada}</td>
                                </template>
                                <template if:true={showTerminoContrato}>
                                <td class={terminoContratoCellClass}>{c.terminoContratoFormatado}</td>
                                </template>
                                <td class={contatoCellClass}>
                                    <template if:true={c.contatoUrl}>
                                        <a href={c.contatoUrl} data-record-id={c.contatoId} data-object="Contact" onclick={handleRelatedRecordClick}>{c.contato}</a>
                                    </template>
                                    <template if:false={c.contatoUrl}>
                                        {c.contato}
                                    </template>
                                </td>
                                <td class={enderecoCellClass}>
                                    <template if:true={c.enderecoUrl}>
                                        <a href={c.enderecoUrl} data-record-id={c.enderecoId} data-object="Endere_o__c" onclick={handleRelatedRecordClick}>{c.endereco}</a>
                                    </template>
                                    <template if:false={c.enderecoUrl}>
                                        {c.endereco}
                                    </template>
                                </td>
                                <template if:true={showStatus}>
                                <td class={statusCellClass}>{c.status}</td>
                                </template>
                                <template if:true={showValor}>
                                <td class={valorCellClass}>{c.valorFormatado}</td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </div>
</template>
